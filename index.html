<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>FitBox</title>
<meta name="description" content="Kalorien, Mahlzeiten, Training und Übungsvideos – einfach und offline.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitBox">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="backBtn" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Heute</h1>
    <button class="icon-btn" id="actionBtn" aria-label="Aktion"></button>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span>Heute</span>
    </button>
    <button data-tab="meals">
      <svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg><span>Mahlzeiten</span>
    </button>
    <button data-tab="training">
      <svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg><span>Training</span>
    </button>
    <button data-tab="weight">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8.5 10a5 5 0 0 1 7 0M12 10l1.5-2"/></svg><span>Gewicht</span>
    </button>
    <button data-tab="videos">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span>Videos</span>
    </button>
  </nav>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <section class="sheet" id="sheet" hidden></section>
  <div class="toast" id="toast" hidden></div>
  <input type="file" id="videoInput" accept="video/*" multiple hidden>
  <input type="file" id="aiVideoInput" accept="video/*" hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="db.js"></script>
  <script src="templates.js"></script>
  <script src="app.js"></script>
</body>
</html>
